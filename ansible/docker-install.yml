---
- name: Install Docker files and Run Container on RHEL 9
  hosts: docker_servers
  become: yes

  tasks:

    - name: Update packages
      dnf:
        name: "*"
        state: latest

    - name: Install Docker
      dnf:
        name: docker
        state: present

    - name: Enable Docker service
      service:
        name: docker
        enabled: yes
        state: started

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Install python3-pip
      dnf:
        name: python3-pip
        state: present

    - name: Install Docker SDK for Python
      pip:
        name: docker

    - name: Run Nginx container
      docker_container:
        name: nginx-container
        image: nginx
        state: started
        restart_policy: always
        ports:
          - "80:80"